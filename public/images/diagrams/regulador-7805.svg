<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Regulador lineal 7805 con condensadores</title>
  <desc id="desc">Esquema de conexión de un regulador 7805 desde 9-12 V a 5 V con condensadores de entrada y salida</desc>
  <rect width="900" height="420" fill="#0d1117"/>
  <style>
    .t{fill:#e6edf3;font:16px 'Segoe UI',Arial}.m{fill:#9da7b3;font:14px 'Segoe UI',Arial}.a{fill:#f0a500;font:14px 'Segoe UI',Arial}.b{fill:#58a6ff;font:14px 'Segoe UI',Arial}
    .w{stroke:#9da7b3;stroke-width:3;fill:none}.p{stroke:#58a6ff;stroke-width:4;fill:none}.g{stroke:#f0a500;stroke-width:4;fill:none}
  </style>
  <text x="450" y="36" text-anchor="middle" class="t">7805: de 9–12 V a 5 V estables</text>
  <line x1="80" y1="170" x2="320" y2="170" class="p"/>
  <line x1="80" y1="300" x2="820" y2="300" class="w"/>
  <rect x="320" y="120" width="140" height="140" rx="10" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="390" y="165" text-anchor="middle" class="t">7805</text>
  <text x="340" y="205" class="m">1 IN</text>
  <text x="430" y="205" class="m" text-anchor="end">3 OUT</text>
  <text x="390" y="245" text-anchor="middle" class="m">2 GND</text>
  <line x1="390" y1="260" x2="390" y2="300" class="w"/>
  <line x1="460" y1="170" x2="820" y2="170" class="g"/>
  <rect x="190" y="120" width="60" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <line x1="220" y1="170" x2="220" y2="120" class="w"/>
  <line x1="220" y1="220" x2="220" y2="300" class="w"/>
  <text x="220" y="105" text-anchor="middle" class="m">C1 0,33 µF</text>
  <rect x="560" y="120" width="60" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <line x1="590" y1="170" x2="590" y2="120" class="w"/>
  <line x1="590" y1="220" x2="590" y2="300" class="w"/>
  <text x="590" y="105" text-anchor="middle" class="m">C2 0,1 µF</text>
  <rect x="720" y="140" width="90" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="765" y="182" text-anchor="middle" class="m">Carga 5 V</text>
  <text x="60" y="160" class="b">VIN 7–12 V</text>
  <text x="840" y="160" class="a">VOUT 5 V</text>
  <text x="450" y="330" text-anchor="middle" class="m">GND común</text>
  <rect x="80" y="350" width="740" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="382" text-anchor="middle" class="m">Disipación: P = (Vin − 5 V) × I · Coloca los condensadores cerca del regulador</text>
</svg>