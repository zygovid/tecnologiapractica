<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Relé con transistor y diodo de flyback, y optoacoplador con aislamiento">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Relé y optoacoplador</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">El relé conmuta cargas; el optoacoplador aísla señales.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

  <rect x="60" y="130" width="620" height="380" rx="16" fill="#1c2230" stroke="#ff7b54" stroke-width="2"/>
  <text x="88" y="170" font-size="21" font-weight="700" fill="#ff7b54">Relé con transistor</text>
  <line x1="88" y1="186" x2="652" y2="186" stroke="#30363d" stroke-width="2"/>
    <line x1="95" y1="205" x2="640" y2="205" stroke="#ff7b54" stroke-width="5"/>
    <text x="95" y="190" font-size="18" fill="#ff7b54">+5 V bobina</text>
    <rect x="250" y="235" width="150" height="70" rx="8" fill="#1c2230" stroke="#ffcc4d" stroke-width="4"/>
    <text x="325" y="278" text-anchor="middle" font-size="18" fill="#e6edf3">bobina 5 V</text>
    <line x1="325" y1="205" x2="325" y2="235" stroke="#58a6ff" stroke-width="5"/>
    <line x1="325" y1="305" x2="325" y2="345" stroke="#58a6ff" stroke-width="5"/>
    <path d="M475 235 L455 270 L495 270 Z" fill="none" stroke="#7ee787" stroke-width="4"/>
    <line x1="475" y1="235" x2="475" y2="305" stroke="#7ee787" stroke-width="4"/>
    <text x="520" y="280" font-size="17" fill="#7ee787">flyback</text>
    <line x1="325" y1="345" x2="325" y2="400" stroke="#e6edf3" stroke-width="6"/>
    <line x1="325" y1="400" x2="270" y2="400" stroke="#e6edf3" stroke-width="6"/>
    <circle cx="325" cy="370" r="34" fill="none" stroke="#7ee787" stroke-width="4"/>
    <text x="180" y="380" font-size="17" fill="#58a6ff">base 1 kΩ</text>
    <text x="120" y="430" font-size="18" fill="#9da7b3">contactos COM · NO · NC</text>
    <text x="120" y="462" font-size="18" fill="#ff7b54">230 V solo con aislamiento y caja</text>
    
  <rect x="720" y="130" width="420" height="380" rx="16" fill="#1c2230" stroke="#7ee787" stroke-width="2"/>
  <text x="748" y="170" font-size="21" font-weight="700" fill="#7ee787">Optoacoplador</text>
  <line x1="748" y1="186" x2="1112" y2="186" stroke="#30363d" stroke-width="2"/>
    <line x1="750" y1="250" x2="790" y2="250" stroke="#58a6ff" stroke-width="5"/>
    <path d="M790 220 L790 280 L830 250 Z" fill="#ffcc4d" opacity="0.8"/>
    <line x1="830" y1="220" x2="830" y2="280" stroke="#ffcc4d" stroke-width="5"/>
    <line x1="830" y1="250" x2="860" y2="250" stroke="#58a6ff" stroke-width="5"/>
    <line x1="940" y1="190" x2="940" y2="330" stroke="#30363d" stroke-width="1" stroke-dasharray="7 7"/>
    <line x1="975" y1="250" x2="1015" y2="250" stroke="#7ee787" stroke-width="5"/>
    <line x1="1015" y1="220" x2="1015" y2="280" stroke="#7ee787" stroke-width="5"/>
    <text x="930" y="180" text-anchor="middle" font-size="16" fill="#9da7b3">aislamiento</text>
    <text x="750" y="340" font-size="18" fill="#9da7b3">LED interno + fototransistor</text>
    <text x="750" y="380" font-size="18" fill="#e6edf3">Entrada: R limitadora</text>
    <text x="750" y="415" font-size="18" fill="#e6edf3">Salida: pull-up</text>
    <text x="750" y="455" font-size="18" fill="#ffcc4d">No alimenta motores directamente</text>
  </g>
</svg>