<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Fuente ajustable para protoboard con módulo buck</title>
  <desc id="desc">Adaptador de 12 V conectado a un módulo buck que alimenta una protoboard a 5 V y 3,3 V</desc>
  <rect width="900" height="420" fill="#0d1117"/>
  <style>
    .t{fill:#e6edf3;font:16px 'Segoe UI',Arial}.m{fill:#9da7b3;font:14px 'Segoe UI',Arial}.a{fill:#f0a500;font:14px 'Segoe UI',Arial}.b{fill:#58a6ff;font:14px 'Segoe UI',Arial}
    .w{stroke:#9da7b3;stroke-width:3;fill:none}.p{stroke:#58a6ff;stroke-width:4;fill:none}.g{stroke:#f0a500;stroke-width:4;fill:none}
  </style>
  <text x="450" y="36" text-anchor="middle" class="t">Proyecto: alimentación ajustable para protoboard (baja tensión)</text>
  <rect x="50" y="150" width="150" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="125" y="200" text-anchor="middle" class="m">Adaptador DC</text>
  <text x="125" y="230" text-anchor="middle" class="a">12 V · 1 A</text>
  <line x1="200" y1="190" x2="280" y2="190" class="g"/>
  <line x1="200" y1="230" x2="280" y2="230" class="w"/>
  <rect x="280" y="130" width="200" height="160" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <text x="380" y="175" text-anchor="middle" class="t">Buck LM2596</text>
  <circle cx="380" cy="220" r="22" fill="#1c2230" stroke="#f0a500" stroke-width="3"/>
  <text x="380" y="260" text-anchor="middle" class="m">ajuste + medida</text>
  <line x1="480" y1="175" x2="560" y2="175" class="b"/>
  <line x1="480" y1="245" x2="560" y2="245" class="w"/>
  <text x="520" y="160" text-anchor="middle" class="b">5,0 V</text>
  <rect x="560" y="110" width="280" height="210" rx="14" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="700" y="145" text-anchor="middle" class="m">Protoboard</text>
  <rect x="590" y="165" width="220" height="16" rx="4" fill="#f0a500" opacity="0.8"/>
  <rect x="590" y="285" width="220" height="16" rx="4" fill="#58a6ff" opacity="0.8"/>
  <text x="700" y="210" text-anchor="middle" class="m">Raíl + (5 V)</text>
  <text x="700" y="265" text-anchor="middle" class="m">Circuito</text>
  <text x="700" y="335" text-anchor="middle" class="m">Raíl − (GND)</text>
  <rect x="70" y="350" width="760" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="382" text-anchor="middle" class="m">Ajusta la salida en vacío, comprueba polaridad y mide de nuevo con carga · Solo baja tensión (5–12 V)</text>
</svg>