<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Alarma con pulsador, 555 monoestable, transistor y zumbador">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Alarma con pulsador y zumbador</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">Cada pulsación activa el zumbador durante un tiempo fijo.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>
<g transform="translate(80 220)">
      <line x1="0" y1="60" x2="55" y2="60" stroke="#58a6ff" stroke-width="5"/>
      <line x1="55" y1="30" x2="55" y2="90" stroke="#e6edf3" stroke-width="5"/>
      <line x1="55" y1="60" x2="120" y2="30" stroke="#e6edf3" stroke-width="4"/>
      <circle cx="55" cy="60" r="5" fill="#58a6ff"/>
      <circle cx="120" cy="30" r="5" fill="#58a6ff"/>
      <text x="50" y="130" font-size="18" fill="#9da7b3">pulsador</text>
    </g>
    <line x1="200" y1="280" x2="300" y2="280" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    
  <rect x="300" y="160" width="240" height="240" rx="16" fill="#1c2230" stroke="#f0a500" stroke-width="2"/>
  <text x="328" y="200" font-size="21" font-weight="700" fill="#f0a500">555</text>
  <line x1="328" y1="216" x2="512" y2="216" stroke="#30363d" stroke-width="2"/>
    <text x="420" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#f0a500">555</text>
    <text x="420" y="290" text-anchor="middle" font-size="18" fill="#9da7b3">monoestable</text>
    <text x="420" y="325" text-anchor="middle" font-size="18" fill="#e6edf3">TRIG · OUT</text>
    <text x="420" y="360" text-anchor="middle" font-size="18" fill="#e6edf3">RESET a Vcc</text>
    <line x1="540" y1="280" x2="630" y2="280" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    
  <rect x="630" y="160" width="220" height="240" rx="16" fill="#1c2230" stroke="#7ee787" stroke-width="2"/>
  <text x="658" y="200" font-size="21" font-weight="700" fill="#7ee787">2N2222</text>
  <line x1="658" y1="216" x2="822" y2="216" stroke="#30363d" stroke-width="2"/>
    <text x="740" y="260" text-anchor="middle" font-size="18" fill="#9da7b3">base 1 kΩ</text>
    <text x="740" y="300" text-anchor="middle" font-size="18" fill="#9da7b3">emisor a GND</text>
    <text x="740" y="340" text-anchor="middle" font-size="18" fill="#7ee787">diodo flyback</text>
    <line x1="850" y1="280" x2="940" y2="280" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    
  <rect x="940" y="160" width="200" height="240" rx="16" fill="#1c2230" stroke="#ff7b54" stroke-width="2"/>
  <text x="968" y="200" font-size="21" font-weight="700" fill="#ff7b54">Zumbador</text>
  <line x1="968" y1="216" x2="1112" y2="216" stroke="#30363d" stroke-width="2"/>
    <text x="1040" y="260" text-anchor="middle" font-size="18" fill="#9da7b3">activo</text>
    <text x="1040" y="300" text-anchor="middle" font-size="18" fill="#9da7b3">5–9 V</text>
    <text x="1040" y="340" text-anchor="middle" font-size="18" fill="#ff7b54">con transistor</text>
    <text x="60" y="455" font-size="20" fill="#7ee787">T = 1,1 × 470 kΩ × 22 µF ≈ 11 s</text>
    <text x="60" y="490" font-size="18" fill="#9da7b3">El zumbador debe ser activo; uno pasivo necesita oscilador.</text>
  </g>
</svg>