<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Módulo L298N con alimentación, entradas de control y motor DC">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Control de motor DC con L298N</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">El módulo recibe la potencia del motor y las señales de control.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

  <rect x="60" y="130" width="720" height="380" rx="16" fill="#1c2230" stroke="#58a6ff" stroke-width="2"/>
  <text x="88" y="170" font-size="21" font-weight="700" fill="#58a6ff">Módulo L298N</text>
  <line x1="88" y1="186" x2="752" y2="186" stroke="#30363d" stroke-width="2"/>
    <rect x="130" y="205" width="530" height="245" rx="14" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
    <text x="395" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#58a6ff">L298N</text>
    <text x="160" y="295" font-size="18" fill="#ff7b54">+12 V</text>
    <text x="160" y="330" font-size="18" fill="#9da7b3">GND</text>
    <text x="160" y="365" font-size="18" fill="#7ee787">+5 V</text>
    <text x="160" y="400" font-size="18" fill="#ffcc4d">jumper 5 V</text>
    <text x="630" y="295" text-anchor="end" font-size="18" fill="#e6edf3">OUT1</text>
    <text x="630" y="330" text-anchor="end" font-size="18" fill="#e6edf3">OUT2</text>
    <text x="630" y="365" text-anchor="end" font-size="18" fill="#e6edf3">IN1 · IN2</text>
    <text x="630" y="400" text-anchor="end" font-size="18" fill="#e6edf3">ENA / PWM</text>
    <text x="395" y="425" text-anchor="middle" font-size="17" fill="#9da7b3">une GND del módulo con GND del control</text>
    
  <rect x="820" y="130" width="320" height="380" rx="16" fill="#1c2230" stroke="#7ee787" stroke-width="2"/>
  <text x="848" y="170" font-size="21" font-weight="700" fill="#7ee787">Conexiones</text>
  <line x1="848" y1="186" x2="1112" y2="186" stroke="#30363d" stroke-width="2"/>
    <text x="850" y="225" font-size="18" fill="#e6edf3">Motor en OUT1 / OUT2</text>
    <text x="850" y="265" font-size="18" fill="#e6edf3">Fuente del motor a +12 V</text>
    <text x="850" y="305" font-size="18" fill="#e6edf3">IN1 / IN2 = sentido</text>
    <text x="850" y="345" font-size="18" fill="#e6edf3">ENA = velocidad PWM</text>
    <text x="850" y="390" font-size="18" fill="#7ee787">No alimentes el motor por USB</text>
    <text x="850" y="430" font-size="18" fill="#ffcc4d">Añade 100 µF en la alimentación</text>
    <text x="850" y="470" font-size="18" fill="#ff7b54">Sujeta el motor antes de probar</text>
  </g>
</svg>