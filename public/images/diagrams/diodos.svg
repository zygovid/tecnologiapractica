<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Diodo con ánodo, cátodo y prueba en modo diodo">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Diodo: polaridad y comprobación</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">La banda marca el cátodo. En directa conduce; en inversa bloquea.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

  <rect x="60" y="130" width="470" height="380" rx="16" fill="#1c2230" stroke="#f0a500" stroke-width="2"/>
  <text x="88" y="170" font-size="21" font-weight="700" fill="#f0a500">Símbolo y encapsulado</text>
  <line x1="88" y1="186" x2="502" y2="186" stroke="#30363d" stroke-width="2"/>
    <g transform="translate(95 220)">
      <line x1="0" y1="130" x2="110" y2="130" stroke="#58a6ff" stroke-width="6"/>
      <path d="M110 80 L110 180 L205 130 Z" fill="none" stroke="#f0a500" stroke-width="6"/>
      <line x1="205" y1="80" x2="205" y2="180" stroke="#e6edf3" stroke-width="7"/>
      <line x1="205" y1="130" x2="320" y2="130" stroke="#58a6ff" stroke-width="6"/>
      <text x="65" y="185" text-anchor="middle" font-size="21" fill="#e6edf3">ánodo</text>
      <text x="260" y="185" text-anchor="middle" font-size="21" fill="#e6edf3">cátodo</text>
      <text x="260" y="220" text-anchor="middle" font-size="18" fill="#9da7b3">banda</text>
      <path d="M205 230 L205 275" stroke="#9da7b3" stroke-width="3"/>
      <text x="260" y="280" text-anchor="middle" font-size="18" fill="#9da7b3">1N4007 · 1N4148 · LED</text>
    </g>
    <text x="95" y="365" font-size="19" fill="#7ee787">La corriente entra por el ánodo</text>
    <text x="95" y="398" font-size="19" fill="#9da7b3">y sale por el cátodo.</text>
    <text x="95" y="440" font-size="19" fill="#ffcc4d">En el esquema, el triángulo apunta al cátodo.</text>
    
  <rect x="570" y="130" width="570" height="380" rx="16" fill="#1c2230" stroke="#58a6ff" stroke-width="2"/>
  <text x="598" y="170" font-size="21" font-weight="700" fill="#58a6ff">Prueba con multímetro</text>
  <line x1="598" y1="186" x2="1112" y2="186" stroke="#30363d" stroke-width="2"/>
    <text x="600" y="225" font-size="20" fill="#e6edf3">1. Sin alimentación</text>
    <text x="600" y="265" font-size="20" fill="#e6edf3">2. Modo diodo (▷|)</text>
    <text x="600" y="305" font-size="20" fill="#e6edf3">3. Rojo al ánodo, negro al cátodo</text>
    <text x="600" y="345" font-size="20" fill="#7ee787">Directa: 0,5–0,8 V</text>
    <text x="600" y="385" font-size="20" fill="#7ee787">Inversa: OL o valor alto</text>
    <text x="600" y="425" font-size="18" fill="#9da7b3">LED: 1,8–3,3 V según color</text>
    <text x="600" y="462" font-size="18" fill="#ff7b54">Si conduce en ambos sentidos: corto</text>
  </g>
</svg>