<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Sensor NTC con comparador y relé para controlar un ventilador">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Sensor de temperatura con comparador</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">NTC → comparador → transistor → relé → ventilador de 12 V.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

  <rect x="60" y="145" width="200" height="120" rx="16" fill="#1c2230" stroke="#ff7b54" stroke-width="2"/>
  <text x="88" y="185" font-size="21" font-weight="700" fill="#ff7b54">NTC 10 kΩ</text>
  <line x1="88" y1="201" x2="232" y2="201" stroke="#30363d" stroke-width="2"/>
    <text x="160" y="235" text-anchor="middle" font-size="18" fill="#9da7b3">divisor 10 kΩ</text>
    
  <rect x="290" y="145" width="200" height="120" rx="16" fill="#1c2230" stroke="#58a6ff" stroke-width="2"/>
  <text x="318" y="185" font-size="21" font-weight="700" fill="#58a6ff">LM393</text>
  <line x1="318" y1="201" x2="462" y2="201" stroke="#30363d" stroke-width="2"/>
    <text x="390" y="235" text-anchor="middle" font-size="18" fill="#9da7b3">umbral + histéresis</text>
    
  <rect x="520" y="145" width="200" height="120" rx="16" fill="#1c2230" stroke="#7ee787" stroke-width="2"/>
  <text x="548" y="185" font-size="21" font-weight="700" fill="#7ee787">2N2222</text>
  <line x1="548" y1="201" x2="692" y2="201" stroke="#30363d" stroke-width="2"/>
    <text x="620" y="235" text-anchor="middle" font-size="18" fill="#9da7b3">etapa de salida</text>
    
  <rect x="750" y="145" width="200" height="120" rx="16" fill="#1c2230" stroke="#ffcc4d" stroke-width="2"/>
  <text x="778" y="185" font-size="21" font-weight="700" fill="#ffcc4d">Relé 5 V</text>
  <line x1="778" y1="201" x2="922" y2="201" stroke="#30363d" stroke-width="2"/>
    <text x="850" y="235" text-anchor="middle" font-size="18" fill="#9da7b3">COM · NO</text>
    
  <rect x="980" y="145" width="160" height="120" rx="16" fill="#1c2230" stroke="#7ee787" stroke-width="2"/>
  <text x="1008" y="185" font-size="21" font-weight="700" fill="#7ee787">Ventilador</text>
  <line x1="1008" y1="201" x2="1112" y2="201" stroke="#30363d" stroke-width="2"/>
    <text x="1060" y="235" text-anchor="middle" font-size="18" fill="#9da7b3">12 V</text>
    <line x1="260" y1="205" x2="290" y2="205" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="490" y1="205" x2="520" y2="205" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="720" y1="205" x2="750" y2="205" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="950" y1="205" x2="980" y2="205" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="160" y="325" text-anchor="middle" font-size="18" fill="#ff7b54">calor: R baja</text>
    <text x="390" y="325" text-anchor="middle" font-size="18" fill="#58a6ff">potenciómetro = consigna</text>
    <text x="620" y="325" text-anchor="middle" font-size="18" fill="#7ee787">diodo de flyback</text>
    <text x="850" y="325" text-anchor="middle" font-size="18" fill="#ffcc4d">contacto NO</text>
    <text x="1060" y="325" text-anchor="middle" font-size="18" fill="#7ee787">fuente aparte</text>
    <text x="60" y="395" font-size="19" fill="#e6edf3">La histéresis evita encendidos y apagados continuos.</text>
    <text x="60" y="430" font-size="19" fill="#9da7b3">Calienta la NTC con los dedos o agua tibia, nunca con llama.</text>
    <text x="60" y="465" font-size="19" fill="#ff7b54">Para 230 V hacen falta aislamiento y instalación segura.</text>
  </g>
</svg>