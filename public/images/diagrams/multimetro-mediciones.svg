<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Tres formas de usar un multímetro: voltaje, continuidad y resistencia">
  <rect width="1200" height="520" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="48" font-size="28" font-weight="700" fill="#e6edf3">Multímetro: tres medidas básicas</text>
    <line x1="40" y1="70" x2="1160" y2="70" stroke="#30363d" stroke-width="2"/>

    <g transform="translate(40 100)">
      <rect width="350" height="360" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="175" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">1. VOLTAJE</text>
      <text x="175" y="72" text-anchor="middle" font-size="16" fill="#9da7b3">En paralelo, con el circuito encendido</text>
      <line x1="60" y1="180" x2="290" y2="180" stroke="#58a6ff" stroke-width="6"/>
      <rect x="145" y="160" width="60" height="40" rx="8" fill="#e6edf3"/>
      <text x="175" y="187" text-anchor="middle" font-size="16" fill="#0d1117">R</text>
      <circle cx="80" cy="180" r="12" fill="#f0a500"/>
      <circle cx="270" cy="180" r="12" fill="#f0a500"/>
      <line x1="95" y1="180" x2="95" y2="290" stroke="#ff6b6b" stroke-width="4"/>
      <line x1="255" y1="180" x2="255" y2="290" stroke="#9da7b3" stroke-width="4"/>
      <rect x="115" y="290" width="120" height="46" rx="10" fill="#0d1117" stroke="#f0a500" stroke-width="2"/>
      <text x="175" y="320" text-anchor="middle" font-size="22" fill="#f0a500" font-family="monospace">5.02 V</text>
      <text x="175" y="365" text-anchor="middle" font-size="15" fill="#9da7b3">R Roja al + · Negra al −</text>
    </g>

    <g transform="translate(425 100)">
      <rect width="350" height="360" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="175" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">2. CONTINUIDAD</text>
      <text x="175" y="72" text-anchor="middle" font-size="16" fill="#9da7b3">Con el circuito apagado</text>
      <path d="M70 210 H170 M210 210 H290" stroke="#58a6ff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="190" cy="210" r="22" fill="none" stroke="#7ee787" stroke-width="4"/>
      <path d="M180 210 L188 218 L202 200" fill="none" stroke="#7ee787" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="80" y1="210" x2="80" y2="290" stroke="#ff6b6b" stroke-width="4"/>
      <line x1="280" y1="210" x2="280" y2="290" stroke="#9da7b3" stroke-width="4"/>
      <rect x="115" y="290" width="120" height="46" rx="10" fill="#0d1117" stroke="#f0a500" stroke-width="2"/>
      <text x="175" y="320" text-anchor="middle" font-size="20" fill="#7ee787" font-family="monospace">BEEP</text>
      <text x="175" y="365" text-anchor="middle" font-size="15" fill="#9da7b3">Si pita, hay paso de corriente</text>
    </g>

    <g transform="translate(810 100)">
      <rect width="350" height="360" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="175" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">3. RESISTENCIA</text>
      <text x="175" y="72" text-anchor="middle" font-size="16" fill="#9da7b3">Sin alimentación y sin tocar patillas</text>
      <line x1="60" y1="200" x2="290" y2="200" stroke="#58a6ff" stroke-width="6"/>
      <path d="M120 200 L135 180 L155 220 L175 180 L195 220 L215 180 L230 200" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linejoin="round"/>
      <line x1="95" y1="200" x2="95" y2="290" stroke="#ff6b6b" stroke-width="4"/>
      <line x1="255" y1="200" x2="255" y2="290" stroke="#9da7b3" stroke-width="4"/>
      <rect x="115" y="290" width="120" height="46" rx="10" fill="#0d1117" stroke="#f0a500" stroke-width="2"/>
      <text x="175" y="320" text-anchor="middle" font-size="22" fill="#f0a500" font-family="monospace">1.0 kΩ</text>
      <text x="175" y="365" text-anchor="middle" font-size="15" fill="#9da7b3">No midas resistencias en tensión</text>
    </g>
  </g>
</svg>
