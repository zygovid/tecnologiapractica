<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Módulo reductor buck LM2596</title>
  <desc id="desc">Conexión de un módulo buck desde 12 V a 5 V con ajuste de potenciómetro y medición con multímetro</desc>
  <rect width="900" height="420" fill="#0d1117"/>
  <style>
    .t{fill:#e6edf3;font:16px 'Segoe UI',Arial}.m{fill:#9da7b3;font:14px 'Segoe UI',Arial}.a{fill:#f0a500;font:14px 'Segoe UI',Arial}.b{fill:#58a6ff;font:14px 'Segoe UI',Arial}
    .w{stroke:#9da7b3;stroke-width:3;fill:none}.p{stroke:#58a6ff;stroke-width:4;fill:none}.g{stroke:#f0a500;stroke-width:4;fill:none}
  </style>
  <text x="450" y="36" text-anchor="middle" class="t">Convertidor buck: más eficiente para bajar tensión</text>
  <rect x="70" y="150" width="140" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="140" y="205" text-anchor="middle" class="m">Fuente DC</text>
  <text x="140" y="235" text-anchor="middle" class="a">12 V</text>
  <line x1="210" y1="185" x2="300" y2="185" class="g"/>
  <line x1="210" y1="235" x2="300" y2="235" class="w"/>
  <rect x="300" y="120" width="260" height="180" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <text x="430" y="165" text-anchor="middle" class="t">Módulo LM2596</text>
  <text x="330" y="210" class="m">IN+</text>
  <text x="330" y="250" class="m">IN−</text>
  <text x="530" y="210" text-anchor="end" class="m">OUT+</text>
  <text x="530" y="250" text-anchor="end" class="m">OUT−</text>
  <circle cx="430" cy="235" r="28" fill="#1c2230" stroke="#f0a500" stroke-width="3"/>
  <line x1="430" y1="207" x2="430" y2="263" stroke="#f0a500" stroke-width="3"/>
  <text x="430" y="285" text-anchor="middle" class="m">potenciómetro</text>
  <line x1="560" y1="185" x2="640" y2="185" class="b"/>
  <line x1="560" y1="235" x2="640" y2="235" class="w"/>
  <rect x="640" y="150" width="180" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="730" y="195" text-anchor="middle" class="m">Multímetro</text>
  <text x="730" y="230" text-anchor="middle" class="b">5,00 V</text>
  <text x="730" y="255" text-anchor="middle" class="m">ajustar antes de cargar</text>
  <rect x="120" y="330" width="660" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="355" text-anchor="middle" class="m">Ventaja: menos calor que un 7805 a corrientes medias/altas · Respeta corriente y tensión máximas</text>
  <text x="450" y="378" text-anchor="middle" class="m">Conecta la carga solo después de ajustar y medir la salida en vacío</text>
</svg>