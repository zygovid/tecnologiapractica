<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Pilas en serie y cálculo de autonomía</title>
  <desc id="desc">Cuatro pilas AA en serie alimentando una carga con ejemplo de cálculo de horas de autonomía</desc>
  <rect width="900" height="420" fill="#0d1117"/>
  <style>
    .t{fill:#e6edf3;font:16px 'Segoe UI',Arial}.m{fill:#9da7b3;font:14px 'Segoe UI',Arial}.a{fill:#f0a500;font:14px 'Segoe UI',Arial}.b{fill:#58a6ff;font:14px 'Segoe UI',Arial}
    .w{stroke:#9da7b3;stroke-width:3;fill:none}.p{stroke:#58a6ff;stroke-width:4;fill:none}.g{stroke:#f0a500;stroke-width:4;fill:none}
  </style>
  <text x="450" y="36" text-anchor="middle" class="t">Autonomía estimada: capacidad / consumo</text>
  <g transform="translate(80,150)">
    <rect x="0" y="0" width="70" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <rect x="85" y="0" width="70" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <rect x="170" y="0" width="70" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <rect x="255" y="0" width="70" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <text x="35" y="82" text-anchor="middle" class="a">AA</text>
    <text x="120" y="82" text-anchor="middle" class="a">AA</text>
    <text x="205" y="82" text-anchor="middle" class="a">AA</text>
    <text x="290" y="82" text-anchor="middle" class="a">AA</text>
  </g>
  <text x="242" y="330" text-anchor="middle" class="m">4 × 1,5 V ≈ 6 V (baja con la carga)</text>
  <line x1="405" y1="225" x2="500" y2="225" class="g"/>
  <line x1="405" y1="265" x2="500" y2="265" class="w"/>
  <rect x="500" y="170" width="140" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="570" y="220" text-anchor="middle" class="m">Carga</text>
  <text x="570" y="248" text-anchor="middle" class="b">100 mA</text>
  <rect x="680" y="150" width="170" height="150" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="765" y="190" text-anchor="middle" class="t">Ejemplo</text>
  <text x="765" y="225" text-anchor="middle" class="m">2000 mAh / 100 mA</text>
  <text x="765" y="255" text-anchor="middle" class="a">≈ 20 h teóricas</text>
  <text x="765" y="285" text-anchor="middle" class="m">real: menos</text>
  <rect x="90" y="350" width="720" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="382" text-anchor="middle" class="m">La tensión cae al descargarse: mide bajo carga y deja margen para el circuito</text>
</svg>