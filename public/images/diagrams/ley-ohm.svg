<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Triángulo de la ley de Ohm con las fórmulas de voltaje, corriente y resistencia">
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">La ley de Ohm en un vistazo</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">Tapa la magnitud que buscas y lee la relación entre las otras dos.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

    <g transform="translate(60 140)">
      <rect width="480" height="370" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <path d="M240 55 L375 320 L105 320 Z" fill="none" stroke="#f0a500" stroke-width="5" stroke-linejoin="round"/>
      <text x="240" y="170" text-anchor="middle" font-size="58" font-weight="700" fill="#e6edf3">V</text>
      <text x="155" y="292" text-anchor="middle" font-size="58" font-weight="700" fill="#e6edf3">I</text>
      <text x="330" y="292" text-anchor="middle" font-size="58" font-weight="700" fill="#e6edf3">R</text>
      <text x="240" y="350" text-anchor="middle" font-size="18" fill="#9da7b3">voltaje · corriente · resistencia</text>
    </g>

    <g transform="translate(580 140)">
      <rect width="580" height="370" rx="16" fill="#0d1117" stroke="#f0a500" stroke-width="2"/>
      <text x="30" y="46" font-size="22" font-weight="700" fill="#f0a500">Tres formas de la misma fórmula</text>
      <text x="30" y="105" font-size="30" fill="#e6edf3">V = I × R</text>
      <text x="30" y="155" font-size="30" fill="#e6edf3">I = V / R</text>
      <text x="30" y="205" font-size="30" fill="#e6edf3">R = V / I</text>
      <line x1="30" y1="232" x2="550" y2="232" stroke="#30363d" stroke-width="2"/>
      <text x="30" y="270" font-size="18" fill="#7ee787">Unidades: voltios (V), amperios (A) y ohmios (Ω).</text>
      <text x="30" y="300" font-size="18" fill="#9da7b3">20 mA = 0,020 A · 4,7 kΩ = 4.700 Ω</text>
      <text x="30" y="344" font-size="18" fill="#9da7b3">Ejemplo: 9 V / 330 Ω = 0,027 A = 27 mA</text>
    </g>
  </g>
</svg>
