<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Transistor NPN como interruptor con resistencia de base y diodo de flyback">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Transistor como interruptor</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">Una señal pequeña controla la carga. La base necesita una resistencia.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

  <rect x="60" y="130" width="470" height="380" rx="16" fill="#1c2230" stroke="#7ee787" stroke-width="2"/>
  <text x="88" y="170" font-size="21" font-weight="700" fill="#7ee787">Símbolo NPN</text>
  <line x1="88" y1="186" x2="502" y2="186" stroke="#30363d" stroke-width="2"/>
    <g transform="translate(90 205)">
      <circle cx="175" cy="120" r="90" fill="none" stroke="#7ee787" stroke-width="4"/>
      <line x1="0" y1="120" x2="120" y2="120" stroke="#58a6ff" stroke-width="6"/>
      <rect x="55" y="95" width="55" height="50" rx="6" fill="#1c2230" stroke="#ffcc4d" stroke-width="4"/>
      <text x="82" y="128" text-anchor="middle" font-size="18" fill="#ffcc4d">R</text>
      <line x1="120" y1="55" x2="120" y2="185" stroke="#e6edf3" stroke-width="7"/>
      <line x1="120" y1="90" x2="190" y2="30" stroke="#e6edf3" stroke-width="6"/>
      <line x1="190" y1="30" x2="190" y2="-10" stroke="#e6edf3" stroke-width="6"/>
      <line x1="120" y1="150" x2="190" y2="210" stroke="#e6edf3" stroke-width="6"/>
      <line x1="190" y1="210" x2="190" y2="260" stroke="#e6edf3" stroke-width="6"/>
      <path d="M175 185 L190 210 L205 180 Z" fill="#e6edf3"/>
      <text x="85" y="225" font-size="20" fill="#58a6ff">B</text>
      <text x="205" y="20" font-size="20" fill="#58a6ff">C</text>
      <text x="205" y="275" font-size="20" fill="#58a6ff">E</text>
    </g>
    <text x="95" y="460" font-size="18" fill="#9da7b3">NPN: base, colector y emisor</text>
    
  <rect x="570" y="130" width="570" height="380" rx="16" fill="#1c2230" stroke="#58a6ff" stroke-width="2"/>
  <text x="598" y="170" font-size="21" font-weight="700" fill="#58a6ff">Montaje de bajo lado</text>
  <line x1="598" y1="186" x2="1112" y2="186" stroke="#30363d" stroke-width="2"/>
    <line x1="610" y1="200" x2="1100" y2="200" stroke="#ff7b54" stroke-width="5"/>
    <text x="610" y="185" font-size="18" fill="#ff7b54">+Vcc</text>
    <rect x="760" y="220" width="150" height="65" rx="8" fill="#1c2230" stroke="#ffcc4d" stroke-width="4"/>
    <text x="835" y="260" text-anchor="middle" font-size="18" fill="#e6edf3">carga</text>
    <line x1="835" y1="200" x2="835" y2="220" stroke="#58a6ff" stroke-width="5"/>
    <line x1="835" y1="285" x2="835" y2="340" stroke="#58a6ff" stroke-width="5"/>
    <line x1="720" y1="310" x2="835" y2="310" stroke="#58a6ff" stroke-width="5"/>
    <text x="690" y="315" font-size="18" fill="#9da7b3">R base</text>
    <text x="610" y="390" font-size="18" fill="#7ee787">Diodo de flyback en paralelo con bobinas</text>
    <text x="610" y="430" font-size="18" fill="#9da7b3">Ib = Ic / hFE · deja margen para saturar</text>
    <text x="610" y="466" font-size="18" fill="#ff7b54">No conectes la carga al emisor en bajo lado</text>
  </g>
</svg>