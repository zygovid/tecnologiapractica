<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Resistencias en serie y en paralelo con sus fórmulas y ejemplos">
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Serie y paralelo no se calculan igual</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">En serie se suman; en paralelo la equivalente siempre es menor que la menor.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

    <g transform="translate(60 140)">
      <rect width="500" height="370" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="250" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#f0a500">En serie</text>
      <line x1="50" y1="150" x2="450" y2="150" stroke="#58a6ff" stroke-width="6"/>
      <path d="M105 150 L125 120 L150 180 L175 120 L200 180 L220 150" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linejoin="round"/>
      <path d="M280 150 L300 120 L325 180 L350 120 L375 180 L395 150" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linejoin="round"/>
      <text x="162" y="108" text-anchor="middle" font-size="18" fill="#e6edf3">R1</text>
      <text x="337" y="108" text-anchor="middle" font-size="18" fill="#e6edf3">R2</text>
      <text x="250" y="220" text-anchor="middle" font-size="24" fill="#7ee787">Rtotal = R1 + R2</text>
      <text x="250" y="265" text-anchor="middle" font-size="19" fill="#9da7b3">220 Ω + 330 Ω = 550 Ω</text>
      <text x="250" y="310" text-anchor="middle" font-size="17" fill="#9da7b3">La corriente es la misma en ambas.</text>
      <text x="250" y="338" text-anchor="middle" font-size="17" fill="#9da7b3">La tensión se reparte.</text>
    </g>

    <g transform="translate(640 140)">
      <rect width="500" height="370" rx="16" fill="#0d1117" stroke="#f0a500" stroke-width="2"/>
      <text x="250" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#f0a500">En paralelo</text>
      <line x1="60" y1="140" x2="440" y2="140" stroke="#58a6ff" stroke-width="6"/>
      <line x1="60" y1="275" x2="440" y2="275" stroke="#58a6ff" stroke-width="6"/>
      <line x1="120" y1="140" x2="120" y2="205" stroke="#e6edf3" stroke-width="5"/>
      <path d="M120 205 L95 225 L145 250 L95 275" fill="none" stroke="#e6edf3" stroke-width="5"/>
      <line x1="330" y1="140" x2="330" y2="205" stroke="#e6edf3" stroke-width="5"/>
      <path d="M330 205 L305 225 L355 250 L305 275" fill="none" stroke="#e6edf3" stroke-width="5"/>
      <text x="105" y="190" text-anchor="end" font-size="18" fill="#e6edf3">R1</text>
      <text x="315" y="190" text-anchor="end" font-size="18" fill="#e6edf3">R2</text>
      <text x="250" y="320" text-anchor="middle" font-size="22" fill="#7ee787">Rtotal = (R1 × R2) / (R1 + R2)</text>
      <text x="250" y="355" text-anchor="middle" font-size="19" fill="#9da7b3">(220 × 330) / 550 = 132 Ω</text>
    </g>
  </g>
</svg>
