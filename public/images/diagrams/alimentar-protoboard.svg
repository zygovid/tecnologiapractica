<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Protoboard con raíles de alimentación, USB y regulador de 3,3 V">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Alimentar una protoboard</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">Comprueba tensión, polaridad y masa común antes de encender.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>
<defs><pattern id="holes" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="15" r="4" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    </pattern></defs>
    
  <rect x="60" y="130" width="620" height="380" rx="16" fill="#1c2230" stroke="#f0a500" stroke-width="2"/>
  <text x="88" y="170" font-size="21" font-weight="700" fill="#f0a500">Raíles y filas</text>
  <line x1="88" y1="186" x2="652" y2="186" stroke="#30363d" stroke-width="2"/>
    <rect x="95" y="215" width="550" height="250" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
    <rect x="110" y="225" width="520" height="32" fill="url(#holes)"/>
    <rect x="110" y="425" width="520" height="32" fill="url(#holes)"/>
    <line x1="115" y1="292" x2="625" y2="292" stroke="#ff7b54" stroke-width="5"/>
    <line x1="115" y1="400" x2="625" y2="400" stroke="#58a6ff" stroke-width="5"/>
    <text x="115" y="282" font-size="17" fill="#ff7b54">+</text>
    <text x="115" y="390" font-size="17" fill="#58a6ff">−</text>
    <rect x="355" y="282" width="10" height="128" fill="#161b22"/>
    <text x="360" y="340" text-anchor="middle" font-size="15" fill="#ffcc4d">corte</text>
    <text x="380" y="470" text-anchor="middle" font-size="18" fill="#9da7b3">las filas centrales conectan de 5 en 5</text>
    
  <rect x="720" y="130" width="420" height="180" rx="16" fill="#1c2230" stroke="#58a6ff" stroke-width="2"/>
  <text x="748" y="170" font-size="21" font-weight="700" fill="#58a6ff">Fuentes habituales</text>
  <line x1="748" y1="186" x2="1112" y2="186" stroke="#30363d" stroke-width="2"/>
    <text x="750" y="220" font-size="19" fill="#e6edf3">USB 5 V · cargador 1 A</text>
    <text x="750" y="255" font-size="19" fill="#e6edf3">4 pilas AA ≈ 6 V</text>
    <text x="750" y="290" font-size="19" fill="#e6edf3">Regulador 3,3 V</text>
    
  <rect x="720" y="330" width="420" height="180" rx="16" fill="#1c2230" stroke="#ff7b54" stroke-width="2"/>
  <text x="748" y="370" font-size="21" font-weight="700" fill="#ff7b54">Antes de encender</text>
  <line x1="748" y1="386" x2="1112" y2="386" stroke="#30363d" stroke-width="2"/>
    <text x="750" y="420" font-size="18" fill="#e6edf3">Mide continuidad entre + y −</text>
    <text x="750" y="452" font-size="18" fill="#e6edf3">Revisa polaridad de electrolíticos</text>
    <text x="750" y="484" font-size="18" fill="#ff7b54">Nunca 230 V en protoboard</text>
  </g>
</svg>