<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Anatomía de una protoboard con filas conectadas, canal central y raíles de alimentación">
  <rect width="1200" height="560" fill="#161b22"/>
  <defs>
    <pattern id="holes" width="40" height="34" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="17" r="4.5" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    </pattern>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Cómo está conectada una protoboard</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">Cada fila de cinco agujeros es un nodo; el canal central separa las dos mitades.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

    <rect x="80" y="140" width="1040" height="370" rx="18" fill="#1c2230" stroke="#30363d" stroke-width="3"/>

    <line x1="100" y1="178" x2="1100" y2="178" stroke="#ff6b6b" stroke-width="5"/>
    <line x1="100" y1="470" x2="1100" y2="470" stroke="#58a6ff" stroke-width="5"/>
    <rect x="110" y="164" width="980" height="28" fill="#ff6b6b" opacity="0.08"/>
    <rect x="110" y="456" width="980" height="28" fill="#58a6ff" opacity="0.08"/>

    <rect x="120" y="222" width="450" height="210" fill="url(#holes)"/>
    <rect x="630" y="222" width="450" height="210" fill="url(#holes)"/>
    <rect x="576" y="210" width="48" height="234" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

    <rect x="120" y="256" width="450" height="34" fill="#f0a500" opacity="0.16" stroke="#f0a500" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="345" y="316" text-anchor="middle" font-size="18" fill="#f0a500">5 agujeros unidos por dentro</text>

    <path d="M600 214 V196" stroke="#9da7b3" stroke-width="3"/>
    <text x="600" y="188" text-anchor="middle" font-size="17" fill="#9da7b3">canal central: no conecta</text>

    <text x="110" y="154" font-size="16" fill="#ff6b6b">raíl positivo (+)</text>
    <text x="110" y="504" font-size="16" fill="#58a6ff">raíl de masa (−)</text>

    <g font-size="17" fill="#e6edf3">
      <circle cx="170" cy="250" r="7" fill="#f0a500"/>
      <circle cx="210" cy="250" r="7" fill="#f0a500"/>
      <circle cx="250" cy="250" r="7" fill="#f0a500"/>
      <circle cx="290" cy="250" r="7" fill="#f0a500"/>
      <circle cx="330" cy="250" r="7" fill="#f0a500"/>
    </g>

    <g transform="translate(830 330)">
      <rect width="220" height="86" rx="10" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>
      <text x="110" y="34" text-anchor="middle" font-size="17" fill="#7ee787">Comprueba los raíles</text>
      <text x="110" y="60" text-anchor="middle" font-size="15" fill="#9da7b3">a veces están partidos</text>
    </g>
  </g>
</svg>
