<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Alimentación por USB para prototipos</title>
  <desc id="desc">Fuente USB de 5 V conectada a módulo breakout y protoboard con indicación de corriente disponible</desc>
  <rect width="900" height="420" fill="#0d1117"/>
  <style>
    .t{fill:#e6edf3;font:16px 'Segoe UI',Arial}.m{fill:#9da7b3;font:14px 'Segoe UI',Arial}.a{fill:#f0a500;font:14px 'Segoe UI',Arial}.b{fill:#58a6ff;font:14px 'Segoe UI',Arial}
    .w{stroke:#9da7b3;stroke-width:3;fill:none}.p{stroke:#58a6ff;stroke-width:4;fill:none}.g{stroke:#f0a500;stroke-width:4;fill:none}
  </style>
  <text x="450" y="36" text-anchor="middle" class="t">USB 5 V: cómodo, pero con límites de corriente y calidad</text>
  <rect x="70" y="150" width="170" height="120" rx="14" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="155" y="200" text-anchor="middle" class="m">Cargador USB</text>
  <text x="155" y="230" text-anchor="middle" class="a">5 V · 1–2 A</text>
  <rect x="280" y="190" width="150" height="30" rx="15" fill="#30363d"/>
  <text x="355" y="245" text-anchor="middle" class="m">cable USB</text>
  <rect x="470" y="150" width="130" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <text x="535" y="195" text-anchor="middle" class="m">Breakout</text>
  <text x="535" y="220" text-anchor="middle" class="m">USB / 5 V</text>
  <text x="535" y="245" text-anchor="middle" class="b">+5 V · GND</text>
  <line x1="600" y1="190" x2="680" y2="190" class="g"/>
  <line x1="600" y1="230" x2="680" y2="230" class="w"/>
  <rect x="680" y="120" width="160" height="180" rx="14" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <rect x="705" y="150" width="110" height="14" rx="4" fill="#f0a500" opacity="0.8"/>
  <rect x="705" y="260" width="110" height="14" rx="4" fill="#58a6ff" opacity="0.8"/>
  <text x="760" y="220" text-anchor="middle" class="m">Protoboard</text>
  <rect x="90" y="320" width="720" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="348" text-anchor="middle" class="m">Comprueba la etiqueta del cargador · Evita puertos USB de portátiles valiosos para pruebas con riesgo</text>
  <text x="450" y="372" text-anchor="middle" class="m">Motores y relés pueden provocar caídas o reinicios: usa fuente externa y masa común</text>
</svg>