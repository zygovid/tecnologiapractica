<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Comparativa de conectores Dupont, JST, clema de tornillo y terminal de krimpado">
  <rect width="1200" height="520" fill="#161b22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="50" font-size="28" font-weight="700" fill="#e6edf3">Cables y conectores para proyectos</text>
    <text x="40" y="82" font-size="17" fill="#9da7b3">Cada conector responde a una necesidad distinta: prueba, alimentación, fijación o resistencia.</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#30363d" stroke-width="2"/>

    <g transform="translate(40 135)">
      <rect width="265" height="330" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="132" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">DUPONT</text>
      <rect x="85" y="100" width="95" height="90" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
      <path d="M105 100 V65 M132 100 V65 M160 100 V65" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
      <path d="M105 190 V235 M132 190 V235 M160 190 V235" stroke="#9da7b3" stroke-width="6" stroke-linecap="round"/>
      <text x="132" y="275" text-anchor="middle" font-size="16" fill="#e6edf3">Protoboard y pruebas</text>
      <text x="132" y="305" text-anchor="middle" font-size="14" fill="#9da7b3">Cómodo, pero se suelta</text>
    </g>

    <g transform="translate(325 135)">
      <rect width="265" height="330" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="132" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">JST</text>
      <rect x="75" y="110" width="115" height="70" rx="12" fill="#f2f2f2"/>
      <rect x="92" y="128" width="16" height="34" rx="4" fill="#d4af37"/>
      <rect x="124" y="128" width="16" height="34" rx="4" fill="#d4af37"/>
      <rect x="156" y="128" width="16" height="34" rx="4" fill="#d4af37"/>
      <path d="M95 180 V230 M132 180 V230 M169 180 V230" stroke="#ff6b6b" stroke-width="6"/>
      <text x="132" y="275" text-anchor="middle" font-size="16" fill="#e6edf3">Baterías y sensores</text>
      <text x="132" y="305" text-anchor="middle" font-size="14" fill="#9da7b3">Compacto y con polaridad</text>
    </g>

    <g transform="translate(610 135)">
      <rect width="265" height="330" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="132" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">CLEMA</text>
      <rect x="55" y="115" width="155" height="80" rx="10" fill="#2f81f7"/>
      <circle cx="87" cy="155" r="17" fill="#0d1117" stroke="#e6edf3" stroke-width="3"/>
      <circle cx="178" cy="155" r="17" fill="#0d1117" stroke="#e6edf3" stroke-width="3"/>
      <path d="M70 195 V245 M60 260 H100" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
      <path d="M195 195 V245 M185 260 H225" stroke="#9da7b3" stroke-width="6" stroke-linecap="round"/>
      <text x="132" y="300" text-anchor="middle" font-size="16" fill="#e6edf3">Bloques de bornes</text>
      <text x="132" y="322" text-anchor="middle" font-size="14" fill="#9da7b3">Fácil de revisar con destornillador</text>
    </g>

    <g transform="translate(895 135)">
      <rect width="265" height="330" rx="16" fill="#1c2230" stroke="#30363d" stroke-width="2"/>
      <text x="132" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f0a500">TERMINAL</text>
      <path d="M70 130 L130 100 L130 210 L70 180 Z" fill="#d4af37" stroke="#e6edf3" stroke-width="3"/>
      <path d="M130 100 L185 130 L185 180 L130 210 Z" fill="#d4af37" stroke="#e6edf3" stroke-width="3"/>
      <rect x="80" y="180" width="95" height="22" rx="6" fill="#8b5a2b"/>
      <path d="M120 202 V245" stroke="#ff6b6b" stroke-width="6"/>
      <text x="132" y="285" text-anchor="middle" font-size="16" fill="#e6edf3">Faston / krimpado</text>
      <text x="132" y="312" text-anchor="middle" font-size="14" fill="#9da7b3">Fijo y resistente a vibración</text>
    </g>
  </g>
</svg>
